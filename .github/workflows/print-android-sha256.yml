name: Print Android SHA-256 (assetlinks)

# One-shot helper: prints upload-key SHA-256 for Digital Asset Links.
# Play App Signing apps also need the App signing key SHA from Play Console
# (Setup → App integrity → App signing → Digital Asset Links JSON).

on:
  workflow_dispatch:

jobs:
  print-sha256:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode keystore and print SHA-256
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/aimediatank-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          ALIAS="${ANDROID_KEY_ALIAS:-}"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          fi
          echo "Alias: $ALIAS"
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | tee "$RUNNER_TEMP/keytool.txt"
          SHA=$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/keytool.txt")
          echo ""
          echo "======= UPLOAD KEY (add to assetlinks.json) ======="
          echo "$SHA"
          echo "===================================================="
          echo "upload_sha256=$SHA" >> "$GITHUB_OUTPUT"
