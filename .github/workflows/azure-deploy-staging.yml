name: Deploy to Azure Staging

on:
  push:
    branches: [staging]  # Deploy to staging on staging branch
  workflow_dispatch:  # Manual trigger option

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: aimediatank-staging  # Separate staging app
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Use ffmpeg-static's prebuilt *static* Linux binary (downloaded on npm install).
      # Do NOT set FFMPEG_BIN to apt's ffmpeg: that binary is dynamically linked to Ubuntu
      # libav*.so; Azure App Service does not ship those libs → "libavdevice.so.60: cannot open
      # shared object file" and exit 127 at transcoding time.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::npm ci failed after 3 attempts (often ffmpeg-static binary download)"
              exit 1
            fi
            echo "npm ci failed (attempt $attempt), retrying in 20s..."
            sleep 20
          done
          test -x node_modules/ffmpeg-static/ffmpeg

      - name: Generate Prisma Client
        run: npx prisma generate

      # Must target the same Postgres as App Service "DATABASE_URL" / connection string, or the app will 500 (P2022) after deploy.
      - name: Push database schema changes
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Clean previous build
        run: rm -rf .next deploy

      - name: Prepare watermark font in public (guest downloads)
        run: |
          mkdir -p public/fonts
          cp node_modules/dejavu-fonts-ttf/ttf/DejaVuSans.ttf public/fonts/
          cp node_modules/dejavu-fonts-ttf/ttf/DejaVuSans-Bold.ttf public/fonts/
          test -f public/fonts/DejaVuSans.ttf

      - name: Check Kakao key for client bundle
        run: |
          if [ -z "$NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY" ]; then
            echo "::warning::KAKAO_JAVASCRIPT_KEY GitHub secret not set — KakaoTalk share will use link-copy fallback only after deploy."
          else
            echo "Kakao JavaScript key present for Next.js build."
          fi
        env:
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NEXT_PUBLIC_* must be set at build time (inlined into client bundle).
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}

      - name: Copy standalone files
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/. ./deploy/
          cp -r .next/static ./deploy/.next/static
          cp -r public ./deploy/public || true
          cp scripts/azure-run.js ./deploy/run.js
          echo "commit=${{ github.sha }}" > ./deploy/BUILD_INFO.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ./deploy/BUILD_INFO.txt

      - name: Copy ffmpeg/ffprobe static binaries for video processing on Azure
        run: |
          mkdir -p deploy/node_modules
          cp -r node_modules/ffmpeg-static deploy/node_modules/
          cp -r node_modules/ffprobe-static deploy/node_modules/
          cp -r node_modules/dejavu-fonts-ttf deploy/node_modules/
          chmod +x deploy/node_modules/ffmpeg-static/ffmpeg
          test -x deploy/node_modules/ffprobe-static/bin/linux/x64/ffprobe
          test -f deploy/node_modules/dejavu-fonts-ttf/ttf/DejaVuSans-Bold.ttf
          test -f deploy/public/fonts/DejaVuSans-Bold.ttf

      - name: Verify deploy package has Next.js (avoids MODULE_NOT_FOUND on Azure)
        run: |
          if [ ! -d deploy/node_modules/next ]; then
            echo "::error::deploy/node_modules/next missing. Standalone build must include node_modules."
            exit 1
          fi
          if [ ! -f deploy/public/ads.txt ]; then
            echo "::error::deploy/public/ads.txt missing. public/ must be copied for AdSense /ads.txt."
            exit 1
          fi
          echo "deploy/node_modules/next present"
          ls -la deploy/ deploy/node_modules/ | head -50

      - name: Deploy to Azure Staging
        id: deploy
        uses: azure/webapps-deploy@v2
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./deploy

      - name: Wait before retry on 409
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Deploy to Azure Staging (retry)
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./deploy

