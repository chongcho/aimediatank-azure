name: Deploy to Azure Staging

on:
  push:
    branches: [staging]  # Deploy to staging on staging branch
  workflow_dispatch:  # Manual trigger option

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: aimediatank-staging  # Separate staging app
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Use ffmpeg-static's prebuilt *static* Linux binary (downloaded on npm install).
      # Do NOT set FFMPEG_BIN to apt's ffmpeg: that binary is dynamically linked to Ubuntu
      # libav*.so; Azure App Service does not ship those libs → "libavdevice.so.60: cannot open
      # shared object file" and exit 127 at transcoding time.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::npm ci failed after 3 attempts (often ffmpeg-static binary download)"
              exit 1
            fi
            echo "npm ci failed (attempt $attempt), retrying in 20s..."
            sleep 20
          done
          test -x node_modules/ffmpeg-static/ffmpeg

      - name: Generate Prisma Client
        run: npx prisma generate

      # Must target the same Postgres as App Service "DATABASE_URL" / connection string, or the app will 500 (P2022) after deploy.
      - name: Push database schema changes
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Clean previous build
        run: rm -rf .next deploy

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Copy standalone files
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/. ./deploy/
          cp -r .next/static ./deploy/.next/static
          cp -r public ./deploy/public || true
          cp scripts/azure-run.js ./deploy/run.js
          echo "Staging build at $(date)" > ./deploy/BUILD_INFO.txt

      - name: Copy ffmpeg-static for video processing on Azure
        run: |
          mkdir -p deploy/node_modules
          cp -r node_modules/ffmpeg-static deploy/node_modules/

      - name: Verify deploy package has Next.js (avoids MODULE_NOT_FOUND on Azure)
        run: |
          if [ ! -d deploy/node_modules/next ]; then
            echo "::error::deploy/node_modules/next missing. Standalone build must include node_modules."
            exit 1
          fi
          echo "deploy/node_modules/next present"
          ls -la deploy/ deploy/node_modules/ | head -50

      - name: Deploy to Azure Staging
        id: deploy
        uses: azure/webapps-deploy@v2
        continue-on-error: true
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./deploy

      - name: Wait before retry on 409
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Deploy to Azure Staging (retry)
        if: steps.deploy.outcome == 'failure'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./deploy

