name: Android Closed Testing

on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: Remote URL loaded by the native shell
        required: false
        default: https://aimediatank.com
      play_track:
        description: Play Console closed-testing track name (exact, case-sensitive)
        required: false
        default: AiMediaTank
      firebase_groups:
        description: Firebase App Distribution tester group alias (emails that group)
        required: false
        default: closed-testers
      release_notes:
        description: Notes emailed to Firebase testers (and shown in App Tester)
        required: false
        default: AiMediaTank closed testing build
      skip_firebase_distribution:
        description: Set true to upload Play only (no Firebase email)
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons:generate

      - name: Capacitor sync (Android)
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url != '' && inputs.capacitor_server_url || 'https://aimediatank.com' }}
        run: |
          npx cap sync android
          node scripts/setup-android-native.js
          # Re-apply after sync so native WebRTC video engine is never stale.
          node scripts/patch-android-fcm.js

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            echo "See docs/android-internal-ci.md for one-time setup."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/aimediatank-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set Android version from repo
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' android/version.properties | cut -d= -f2 | tr -d '\r\n ')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::VERSION_NAME missing in android/version.properties"
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          echo "Android release: $VERSION_NAME (versionCode $((GITHUB_RUN_NUMBER + 10)))"

      - name: Build signed AAB + APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # AAB → Play Closed testing; APK → Firebase App Distribution (email testers).
          ./gradlew bundleRelease assembleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/
          ls -la app/build/outputs/apk/release/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload to Play Closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aimediatank.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.play_track != '' && inputs.play_track || 'AiMediaTank' }}
          status: completed

      # TestFlight-style email: Firebase emails the closed-testers group when a build is uploaded.
      # Requires FIREBASE_SERVICE_ACCOUNT_JSON with Firebase App Distribution Admin (see docs).
      - name: Decide Firebase App Distribution
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SKIP: ${{ inputs.skip_firebase_distribution }}
        run: |
          set -euo pipefail
          if [ "${SKIP}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase App Distribution (workflow input)."
            exit 0
          fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret missing — Play upload done; no tester email. See docs/android-internal-ci.md"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        if: steps.firebase.outputs.enabled == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          # mobilesdk_app_id from android/app/google-services.json
          appId: "1:1088256844071:android:3f7322d178a16c002bc902"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ inputs.firebase_groups != '' && inputs.firebase_groups || 'closed-testers' }}
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            ${{ inputs.release_notes }}
            versionName ${{ env.ANDROID_VERSION_NAME }} · versionCode ${{ env.ANDROID_VERSION_CODE }}
            sha ${{ github.sha }}
