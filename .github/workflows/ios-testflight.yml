name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner (self-hosted MacinCloud recommended)
        type: choice
        options:
          - self-hosted
          - github-hosted
        default: self-hosted
      capacitor_server_url:
        description: Remote URL loaded by the native shell
        required: false
        default: https://aimediatank.com

jobs:
  build-and-upload:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted", "macOS"]') || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (iOS)
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url }}
        run: npx cap sync ios

      - name: Select Xcode (GitHub-hosted)
        if: inputs.runner == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Select Xcode (self-hosted)
        if: inputs.runner == 'self-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Configure App manual signing
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_DEVELOPER_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import sys

          pbxproj = "App.xcodeproj/project.pbxproj"
          team = os.environ["IOS_TEAM_ID"]
          profile = os.environ["IOS_PROVISIONING_PROFILE_NAME"]

          content = open(pbxproj, encoding="utf-8").read()
          if "ProvisioningStyle = Automatic;" not in content:
              print("Expected Automatic provisioning style in project.pbxproj", file=sys.stderr)
              sys.exit(1)

          content = content.replace(
              "ProvisioningStyle = Automatic;",
              "ProvisioningStyle = Manual;",
              1,
          )

          pattern = (
              r"(baseConfigurationReference = AF51FD2D460BCFE21FA515B2 /\* Pods-App\.release\.xcconfig \*/;\n"
              r"\t\t\tbuildSettings = \{)(.*?)(\t\t\t\};\n\t\t\tname = Release;)"
          )
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              print("App Release build configuration not found in project.pbxproj", file=sys.stderr)
              sys.exit(1)

          settings = match.group(2)
          if "CODE_SIGN_STYLE = Automatic;" not in settings:
              print("Expected CODE_SIGN_STYLE = Automatic in App Release config", file=sys.stderr)
              sys.exit(1)

          settings = settings.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          for key in ("DEVELOPMENT_TEAM", "CODE_SIGN_IDENTITY", "PROVISIONING_PROFILE_SPECIFIER"):
              if key in settings:
                  print(f"Unexpected existing {key} in App Release config", file=sys.stderr)
                  sys.exit(1)

          def pbx_quote(value: str) -> str:
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          settings = settings.replace(
              "CODE_SIGN_STYLE = Manual;",
              "\n".join(
                  [
                      "CODE_SIGN_STYLE = Manual;",
                      f"\t\t\t\tDEVELOPMENT_TEAM = {team};",
                      '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";',
                      f"\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {pbx_quote(profile)};",
                  ]
              ),
          )

          content = content[: match.start(2)] + settings + content[match.end(2) :]
          open(pbxproj, "w", encoding="utf-8").write(content)
          print("Configured manual signing on App Release target")
          PY

      - name: Prepare signing keychain
        run: security delete-keychain signing_temp.keychain 2>/dev/null || true

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          cleaned="$(printf '%s' "$PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]')"
          if [ -z "$cleaned" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is empty."
            exit 1
          fi
          if ! printf '%s' "$cleaned" | base64 --decode -o "$PROFILE_PATH" 2>/dev/null; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is not valid base64. Re-encode AiMediaTank_AppStore.mobileprovision."
            exit 1
          fi
          if [ ! -s "$PROFILE_PATH" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 decoded to an empty file."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Archive iOS app
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_DEVELOPER_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ ! -f App.xcworkspace/contents.xcworkspacedata ]; then
            echo "App.xcworkspace missing after pod install."
            exit 1
          fi
          security find-identity -v -p codesigning
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0"

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_DEVELOPER_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.aimediatank.apple string $IOS_PROVISIONING_PROFILE_NAME" "$EXPORT_PLIST"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"
          echo "IPA_PATH=$EXPORT_PATH/App.ipa" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"

          decode_base64_key() {
            local input="$1"
            local cleaned
            cleaned="$(printf '%s' "$input" | tr -d '[:space:]')"
            [ -n "$cleaned" ] || return 1
            printf '%s' "$cleaned" | base64 --decode -o "$KEY_FILE" 2>/dev/null
          }

          if [ -n "${APPSTORE_PRIVATE_KEY_BASE64:-}" ]; then
            if ! decode_base64_key "$APPSTORE_PRIVATE_KEY_BASE64"; then
              echo "APPSTORE_PRIVATE_KEY_BASE64 is set but is not valid base64."
              exit 1
            fi
            echo "Using APPSTORE_PRIVATE_KEY_BASE64"
          elif printf '%s' "$APPSTORE_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%b' "$APPSTORE_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
            echo "Using APPSTORE_PRIVATE_KEY (PEM)"
          elif decode_base64_key "$APPSTORE_PRIVATE_KEY"; then
            echo "Using APPSTORE_PRIVATE_KEY (base64). Prefer APPSTORE_PRIVATE_KEY_BASE64 instead."
          else
            echo "No valid App Store Connect API key found."
            echo "Add repository secret APPSTORE_PRIVATE_KEY_BASE64 (recommended):"
            echo "  GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: APPSTORE_PRIVATE_KEY_BASE64"
            echo "  Value: one-line base64 from appstore-key.b64.txt (no spaces or line breaks)"
            if [ -n "${APPSTORE_PRIVATE_KEY_BASE64:-}" ]; then
              echo "APPSTORE_PRIVATE_KEY_BASE64: set but failed decode (${#APPSTORE_PRIVATE_KEY_BASE64} chars)"
            else
              echo "APPSTORE_PRIVATE_KEY_BASE64: not set"
            fi
            if [ -n "${APPSTORE_PRIVATE_KEY:-}" ]; then
              echo "APPSTORE_PRIVATE_KEY: set but not PEM or valid base64 (${#APPSTORE_PRIVATE_KEY} chars)"
            else
              echo "APPSTORE_PRIVATE_KEY: not set"
            fi
            exit 1
          fi
          if [ ! -s "$KEY_FILE" ]; then
            echo "App Store Connect API key decoded to an empty file."
            exit 1
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_FILE"; then
            echo "App Store Connect API key is not a PKCS8 private key."
            exit 1
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout >/dev/null 2>&1; then
            echo "App Store Connect API key failed openssl validation."
            exit 1
          fi
          {
            echo 'APPSTORE_PRIVATE_KEY<<EOF'
            cat "$KEY_FILE"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY }}
