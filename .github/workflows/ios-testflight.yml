name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner (self-hosted MacinCloud recommended)
        type: choice
        options:
          - self-hosted
          - github-hosted
        default: self-hosted
      capacitor_server_url:
        description: Remote URL loaded by the native shell
        required: false
        default: https://aimediatank.com

jobs:
  build-and-upload:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted", "macOS"]') || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (iOS)
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url }}
        run: npx cap sync ios

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          cleaned="$(printf '%s' "$PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]')"
          if [ -z "$cleaned" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is empty."
            exit 1
          fi
          if ! printf '%s' "$cleaned" | base64 --decode -o "$PROFILE_PATH" 2>/dev/null; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is not valid base64. Re-encode AiMediaTank_AppStore.mobileprovision."
            exit 1
          fi
          if [ ! -s "$PROFILE_PATH" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 decoded to an empty file."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Resolve Swift packages
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release

      - name: Archive iOS app
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_DEVELOPER_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=com.aimediatank.apple \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0"

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_DEVELOPER_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.aimediatank.apple string $IOS_PROVISIONING_PROFILE_NAME" "$EXPORT_PLIST"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"
          echo "IPA_PATH=$EXPORT_PATH/App.ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
