name: Sync main from staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Prevent infinite loop: when this workflow pushes, actor is github-actions[bot]
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main staging --prune

      - name: Sync main from staging
        shell: bash
        run: |
          set -euo pipefail
          echo "Syncing main from staging..."
          git checkout main
          git merge --no-edit origin/staging
          git push origin main

      # IMPORTANT:
      # Pushes made with GITHUB_TOKEN do NOT trigger other workflows via `on: push`.
      # So we explicitly dispatch the production deploy workflow here.
      - name: Trigger production deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'azure-deploy.yml',
              ref: 'main',
            })

