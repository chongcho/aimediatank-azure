name: Sync main from staging

# Release pipeline (one push to staging):
#   1. This workflow — merge staging → main
#   2. Trigger Deploy to Azure Staging + Deploy to Azure Production (same SHA)
# Android Internal Testing remains manual workflow_dispatch only.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    # Prevent infinite loop: when this workflow pushes, actor is github-actions[bot]
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main staging --prune

      - name: Sync main from staging
        shell: bash
        run: |
          set -euo pipefail
          echo "Syncing main from staging..."
          git checkout main
          git merge --no-edit origin/staging
          git push origin main
          echo "SYNCED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Synced main to $(git rev-parse --short HEAD)"

      # GITHUB_TOKEN pushes do not fire `on: push` workflows (GitHub loop guard).
      # After sync, explicitly dispatch staging + production so both deploy the same tip.
      # Retries: GitHub Actions API occasionally returns transient HTTP 503.
      - name: Trigger staging and production deploys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trigger_with_retry() {
            local workflow_name="$1"
            local ref="$2"
            local attempt=1
            local max_attempts=8
            local sleep_secs=15
            echo "Triggering ${workflow_name} for ${ref} @ ${SYNCED_SHA:0:7}"
            while true; do
              if gh workflow run "${workflow_name}" --ref "${ref}"; then
                echo "${workflow_name} triggered (attempt ${attempt})."
                return 0
              fi
              local exit_code=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Failed to trigger ${workflow_name} after ${max_attempts} attempts (last exit ${exit_code})."
                return "${exit_code}"
              fi
              echo "Attempt ${attempt}/${max_attempts} for ${workflow_name} failed (exit ${exit_code}); retrying in ${sleep_secs}s..."
              attempt=$((attempt + 1))
              sleep "${sleep_secs}"
              sleep_secs=$((sleep_secs + 10))
            done
          }

          # Order: sync already done; deploy staging then production (same synced tip).
          trigger_with_retry "Deploy to Azure Staging" staging
          trigger_with_retry "Deploy to Azure Production" main
          echo "Both deploy workflows dispatched for ${SYNCED_SHA:0:7}."
