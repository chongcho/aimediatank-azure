name: Sync main from staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    # Prevent infinite loop: when this workflow pushes, actor is github-actions[bot]
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main staging --prune

      - name: Sync main from staging
        shell: bash
        run: |
          set -euo pipefail
          echo "Syncing main from staging..."
          git checkout main
          git merge --no-edit origin/staging
          git push origin main
          echo "SYNCED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Synced main to $(git rev-parse --short HEAD)"

      # GITHUB_TOKEN pushes do not fire `on: push` workflows (GitHub loop guard).
      # Trigger production only after main contains the staging tip — avoids deploying
      # an older manual workflow_dispatch SHA while sync is still in flight.
      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Triggering Deploy to Azure Production for main @ ${SYNCED_SHA:0:7}"
          gh workflow run "Deploy to Azure Production" --ref main

