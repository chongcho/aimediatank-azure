name: Sync main from staging

# Release pipeline (push to staging):
#   1. azure-deploy-staging.yml — deploy staging Azure app
#   2. This workflow — merge staging → main, then trigger production
#   3. azure-deploy.yml — deploy production (aimediatank.com)
#   4. android-internal.yml — manual workflow_dispatch only (Closed testing track AiMediaTank)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    # Prevent infinite loop: when this workflow pushes, actor is github-actions[bot]
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main staging --prune

      - name: Sync main from staging
        shell: bash
        run: |
          set -euo pipefail
          echo "Syncing main from staging..."
          git checkout main
          git merge --no-edit origin/staging
          git push origin main
          echo "SYNCED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Synced main to $(git rev-parse --short HEAD)"

      # GITHUB_TOKEN pushes do not fire `on: push` workflows (GitHub loop guard).
      # Trigger production only after main contains the staging tip — avoids deploying
      # an older manual workflow_dispatch SHA while sync is still in flight.
      # Retries: GitHub Actions API occasionally returns transient HTTP 503.
      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Triggering Deploy to Azure Production for main @ ${SYNCED_SHA:0:7}"
          attempt=1
          max_attempts=8
          sleep_secs=15
          while true; do
            if gh workflow run "Deploy to Azure Production" --ref main; then
              echo "Production deploy workflow triggered (attempt ${attempt})."
              exit 0
            fi
            exit_code=$?
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to trigger production deploy after ${max_attempts} attempts (last exit ${exit_code})."
              echo "Main is already synced to ${SYNCED_SHA:0:7} — re-run 'Deploy to Azure Production' manually if needed."
              exit "${exit_code}"
            fi
            echo "Attempt ${attempt}/${max_attempts} failed (exit ${exit_code}); retrying in ${sleep_secs}s..."
            attempt=$((attempt + 1))
            sleep "${sleep_secs}"
            sleep_secs=$((sleep_secs + 10))
          done

